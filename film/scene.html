<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>112Sim film — scene</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="frame" width="1920" height="1080"></canvas>
<script type="module">
  // The render target. render.mjs drives this page:
  //   window.renderFrame(segmentId, frameIndex)   draws one frame on #frame
  //   window.segments                             { id: durationS }
  // Open with ?segment=test&frame=30 to look at a single frame by hand.
  import { createScene } from './src/scene.js';
  import { poseParams, POSES } from './src/poses.js';
  import { RIG_PARAMS } from './src/rig/params.js';

  const scene = createScene(document.getElementById('frame'));

  window.renderFrame = (segmentId, frameIndex, options) => {
    scene.renderFrame(segmentId, frameIndex, options);
  };
  window.segments = scene.segments;
  window.segmentInfo = scene.segmentInfo;
  window.validateSegment = scene.validateSegment;
  window.checkSegment = scene.checkSegment;
  window.poseParams = poseParams;
  window.poseNames = Object.keys(POSES);
  window.rigParams = RIG_PARAMS;

  const q = new URLSearchParams(location.search);
  if (q.has('segment')) window.renderFrame(q.get('segment'), Number(q.get('frame') || 0));

  window.sceneReady = true;
</script>
</body>
</html>
