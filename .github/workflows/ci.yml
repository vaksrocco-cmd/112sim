name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for app
        id: app
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No package.json yet, skipping."; fi
      - uses: actions/setup-node@v4
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.app.outputs.present == 'true'
        run: npm ci
      - if: steps.app.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.app.outputs.present == 'true'
        run: npm run test
      - if: steps.app.outputs.present == 'true'
        run: npm run lint
      - name: Refuse committed env files
        run: |
          if git ls-files | grep -E '(^|/)\.env' | grep -v '\.env\.example$'; then
            echo "::error::An .env file is committed. Remove it and rotate the keys."; exit 1; fi
